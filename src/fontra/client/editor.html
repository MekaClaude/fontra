<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Fontra</title>
  <link href="/css/shared.css" rel="stylesheet" />
  <link href="/css/core.css" rel="stylesheet" />
  <link href="/css/figma-theme.css" rel="stylesheet" />
  <link href="css/editor.af9ead68.css" rel="stylesheet" />
  <link href="/css/tooltip.css" rel="stylesheet" />
  <script type="importmap">
      {
        "imports": {
          "fontra/": "/"
        }
      }
    </script>
</head>

<body>
  <modal-dialog></modal-dialog>

  <div id="global-loader-spinner"></div>

  <div class="editor-container">
    <div class="top-bar-container cleanable-overlay"></div>
    <div class="sidebar-container cleanable-overlay left">
      <div class="sidebar-resize-gutter" data-grow-direction="right"></div>
    </div>
    <div class="main-container">
      <canvas id="edit-canvas" class="focus-preferred" tabindex="1" lang="en"></canvas>

      <div id="metric-handle-container">
        <!-- content will be filled in dynamically -->
      </div>

      <div id="mini-console"></div>

      <div class="main-overlay-container cleanable-overlay">
        <div class="tab-overlay-container left">
          <div class="sidebar-shadow-box"></div>
        </div>
        <div class="tool-overlay-container">
          <div class="tools-overlay" id="tools-draggable">
            <div id="edit-tools" class="tools-item">
              <!-- content will be filled in dynamically -->
            </div>
            <div id="zoom-tools" class="tools-item">
              <div class="tool-button" data-tool="zoom-out" data-tooltip="Zoom out" data-tooltipposition="bottom">
                <inline-svg class="tool-icon" src="/images/minus.svg"></inline-svg>
              </div>
              <div class="tool-button" data-tool="zoom-in" data-tooltip="Zoom in" data-tooltipposition="bottom">
                <inline-svg class="tool-icon" src="/images/plus.svg"></inline-svg>
              </div>
              <div class="tool-button" data-tool="zoom-fit-selection" data-tooltip="Zoom to fit selection"
                data-tooltipposition="bottom">
                <inline-svg class="tool-icon" src="/images/bullseye.svg"></inline-svg>
              </div>
              <div class="tool-button" data-tool="toggle-fullscreen" data-tooltip="Toggle fullscreen"
                data-tooltipposition="bottom">
                <inline-svg class="tool-icon tool-icon--fullscreen-enter tool-icon--hidden"
                  src="/tabler-icons/maximize.svg"></inline-svg>
                <inline-svg class="tool-icon tool-icon--fullscreen-exit tool-icon--hidden"
                  src="/tabler-icons/minimize.svg"></inline-svg>
              </div>
            </div>
          </div>
        </div>
        <div class="tab-overlay-container right">
          <div class="sidebar-shadow-box"></div>
        </div>
      </div>
    </div>
    <div class="sidebar-container cleanable-overlay right">
      <div class="sidebar-resize-gutter" data-grow-direction="left"></div>
    </div>
  </div>
</body>

<script type="module" src="js/npm.lib-font.2d4b7dff.js"></script>
<script type="module" src="js/fontra-core.535ae066.js"></script>
<script type="module" src="js/fontra-webcomponents.67235d84.js"></script>
<script type="module" src="js/npm.fflate.2308071b.js"></script>
<script type="module" src="js/npm.bezier-js.5e0f7da7.js"></script>
<script type="module" src="js/views-editor.c0d05d6c.js"></script>
<script type="module" src="js/npm.harfbuzzjs.f79d9bfa.js"></script>
<script type="module" src="js/start.4.6ccd2244.js"></script>

</html>
